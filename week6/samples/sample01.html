<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fetch and render posts from JSONPlaceholder.">
  <title>Latest Posts · Week 6 | Web Programming</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="api-page">
  <header class="site-header"><a class="wordmark" href="../../index.html"><span class="wordmark-mark">WP</span><span>Course workbook</span></a><a class="back-link" href="../index.html">← Week 6</a></header>
  <main class="demo-main">
    <a class="demo-back" href="../index.html">← All Week 6 samples</a>
    <section class="demo-intro"><p class="eyebrow">SAMPLE 01 · FETCH AND RENDER</p><h1>Latest Posts</h1><p>Load a set of posts from a public API and build the page from the response.</p></section>
    <section class="demo-panel" aria-label="Posts demo">
      <div class="demo-heading"><div><p class="eyebrow">JSONPLACEHOLDER</p><h2>Post feed</h2></div></div>
      <button class="api-button" id="load-posts" type="button">Load posts</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="posts" class="post-grid"></div>
    </section>
  </main>
  <footer class="site-footer"><span>WEB PROGRAMMING · K0126002</span><a href="../index.html">Week 6 samples</a></footer>
  <script>
    const status = document.querySelector('#status');
    const postsContainer = document.querySelector('#posts');
    const loadButton = document.querySelector('#load-posts');

    loadButton.addEventListener('click', async () => {
      status.textContent = 'Loading posts…';
      status.dataset.state = 'loading';
      postsContainer.replaceChildren();
      loadButton.disabled = true;

      try {
        const response = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=10');
        if (!response.ok) throw new Error(`The server responded with ${response.status}.`);
        const posts = await response.json();
        if (!Array.isArray(posts)) throw new Error('The response did not contain a posts list.');

        const cards = posts.map((post, index) => {
          const article = document.createElement('article');
          article.className = 'post-card';
          const number = document.createElement('span');
          number.className = 'post-index';
          number.textContent = `Post ${String(index + 1).padStart(2, '0')}`;
          const title = document.createElement('h2');
          title.textContent = post.title;
          const body = document.createElement('p');
          body.textContent = post.body;
          article.append(number, title, body);
          return article;
        });

        postsContainer.replaceChildren(...cards);
        status.textContent = `Loaded ${posts.length} posts successfully.`;
        status.dataset.state = 'success';
      } catch (error) {
        status.textContent = `Could not load posts. ${error.message}`;
        status.dataset.state = 'error';
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
