<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Load a gallery of random dog photos from Dog CEO.">
  <title>Dog Spotlight · Week 6 | Web Programming</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="api-page">
  <header class="site-header"><a class="wordmark" href="../../index.html"><span class="wordmark-mark">WP</span><span>Course workbook</span></a><a class="back-link" href="../index.html">← Week 6</a></header>
  <main class="demo-main">
    <a class="demo-back" href="../index.html">← All Week 6 samples</a>
    <section class="demo-intro"><p class="eyebrow">SAMPLE 05 · FETCH IMAGE COLLECTIONS</p><h1>Dog Spotlight</h1><p>Request a set of dog photos from a public API and display a fresh lineup of furry friends.</p></section>
    <section class="demo-panel" aria-label="Dog image gallery">
      <div class="demo-heading"><div><p class="eyebrow">DOG CEO</p><h2>Fresh dog picks</h2></div></div>
      <button class="api-button" id="load-dogs" type="button">Load dogs</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="dogs" class="hero-grid"></div>
    </section>
  </main>
  <footer class="site-footer"><span>WEB PROGRAMMING · K0126002</span><a href="../index.html">Week 6 samples</a></footer>
  <script>
    const dogsContainer = document.querySelector('#dogs');
    const status = document.querySelector('#status');
    const loadButton = document.querySelector('#load-dogs');

    loadButton.addEventListener('click', async () => {
      status.textContent = 'Fetching adorable dogs…';
      status.dataset.state = 'loading';
      dogsContainer.replaceChildren();
      loadButton.disabled = true;

      try {
        const response = await fetch('https://dog.ceo/api/breeds/image/random/6');
        if (!response.ok) throw new Error(`The server responded with ${response.status}.`);
        const data = await response.json();
        const dogs = Array.isArray(data.message) ? data.message : [];
        if (!dogs.length) throw new Error('The response did not include any dog images.');

        const cards = dogs.map((dogUrl) => {
          const card = document.createElement('article');
          card.className = 'hero-card';
          const image = document.createElement('img');
          image.src = dogUrl;
          image.alt = 'A happy dog';
          image.loading = 'lazy';
          const info = document.createElement('div');
          info.className = 'hero-info';
          const title = document.createElement('h2');
          title.textContent = 'Dog photo';
          const subtitle = document.createElement('p');
          subtitle.textContent = 'Fresh from the API.';
          info.append(title, subtitle);
          card.append(image, info);
          return card;
        });

        dogsContainer.replaceChildren(...cards);
        status.textContent = `Loaded ${dogs.length} dog photos.`;
        status.dataset.state = 'success';
      } catch (error) {
        status.textContent = `Could not load dogs. ${error.message}`;
        status.dataset.state = 'error';
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
