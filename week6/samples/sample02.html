<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate and explore a random sample user profile.">
  <title>Random User Generator · Week 6 | Web Programming</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="api-page">
  <header class="site-header"><a class="wordmark" href="../../index.html"><span class="wordmark-mark">WP</span><span>Course workbook</span></a><a class="back-link" href="../index.html">← Week 6</a></header>
  <main class="demo-main">
    <a class="demo-back" href="../index.html">← All Week 6 samples</a>
    <section class="demo-intro"><p class="eyebrow">SAMPLE 02 · FETCH A PROFILE</p><h1>Random User Generator</h1><p>Request a sample profile and display the details returned by the API.</p></section>
    <section class="demo-panel" aria-label="Random user demo">
      <div class="demo-heading"><div><p class="eyebrow">RANDOMUSER.ME</p><h2>Meet someone new</h2></div></div>
      <button class="api-button" id="load-user" type="button">Get a random user</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <article class="user-card" id="user-card"><p class="user-placeholder">Click the button to get a user profile.</p></article>
    </section>
  </main>
  <footer class="site-footer"><span>WEB PROGRAMMING · K0126002</span><a href="../index.html">Week 6 samples</a></footer>
  <script>
    const status = document.querySelector('#status');
    const card = document.querySelector('#user-card');
    const loadButton = document.querySelector('#load-user');

    loadButton.addEventListener('click', async () => {
      status.textContent = 'Finding a profile…';
      status.dataset.state = 'loading';
      loadButton.disabled = true;

      try {
        const response = await fetch('https://randomuser.me/api/');
        if (!response.ok) throw new Error(`The server responded with ${response.status}.`);
        const data = await response.json();
        const user = data.results?.[0];
        if (!user) throw new Error('The response did not contain a user profile.');

        const image = document.createElement('img');
        image.className = 'user-avatar';
        image.src = user.picture.large;
        image.alt = `Portrait of ${user.name.first} ${user.name.last}`;
        const details = document.createElement('div');
        const name = document.createElement('h2');
        name.textContent = `${user.name.first} ${user.name.last}`;
        const email = document.createElement('p');
        email.textContent = user.email;
        const country = document.createElement('p');
        country.className = 'user-country';
        country.textContent = user.location.country;
        details.append(name, email, country);
        card.replaceChildren(image, details);
        status.textContent = 'Profile loaded successfully.';
        status.dataset.state = 'success';
      } catch (error) {
        status.textContent = `Unable to load a user. ${error.message}`;
        status.dataset.state = 'error';
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
